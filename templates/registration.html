{% extends "base.html" %}
{% block title %}Registration{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card p-4">
  <h4 class="mb-3">User registration</h4>
  <form method="post" novalidate>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Username</label>
        <input name="username" class="form-control" value="{{ form.get('username','') }}" required></div>
      <div class="col-md-6"><label class="form-label">Email</label>
        <input name="email" type="email" class="form-control" value="{{ form.get('email','') }}" required></div>
      <div class="col-md-6"><label class="form-label">Phone number</label>
        <input name="phone" class="form-control" value="{{ form.get('phone','') }}" required></div>
      <div class="col-md-6"><label class="form-label">Address</label>
        <input name="address" class="form-control" value="{{ form.get('address','') }}" required></div>
      <div class="col-md-6"><label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Confirm password</label>
        <input name="confirm_password" type="password" class="form-control" required></div>
    </div>
    <button class="btn btn-primary w-100 mt-4">Register</button>
  </form>
  <p class="small mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div></div></div>
{% endblock %}
